<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Capsule — exact-recoverable token efficiency for Codex</title>
  <desc id="desc">A local-first Codex plugin and MCP server for compact evidence with exact local recovery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#173451"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1070" cy="-20" r="310" fill="#58a6ff" opacity=".12"/>
  <circle cx="1030" cy="570" r="230" fill="#3fb950" opacity=".10"/>
  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="112" y="122" width="120" height="10" rx="5" fill="url(#accent)"/>
  <text x="112" y="184" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">CODEX PLUGIN · MCP SERVER</text>
  <text x="112" y="292" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Spend context on</text>
  <text x="112" y="366" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">the task, not repetition.</text>
  <text x="112" y="438" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="26">Exact-recoverable evidence for terminal, files, projects, web, and context.</text>
  <text x="112" y="512" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">hakiyaka.github.io/capsule</text>
  <text x="1010" y="512" fill="#3fb950" font-family="Arial, Helvetica, sans-serif" font-size="25" text-anchor="end">CAPSULE</text>
</svg>
