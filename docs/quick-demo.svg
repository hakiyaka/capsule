<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Capsule terminal evidence demo</title>
  <desc id="desc">An illustrative comparison of a repeated terminal result and a compact exact-recoverable Capsule view.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#172b42"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="22" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="492" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="92" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Capsule keeps the result recoverable and shows the task-sized view</text>
  <text x="72" y="128" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="18">Illustrative shape only - run the paired benchmark for your own workload.</text>
  <rect x="72" y="166" width="500" height="274" rx="12" fill="#0b0f14" stroke="#30363d"/>
  <rect x="628" y="166" width="500" height="274" rx="12" fill="#0b0f14" stroke="#30363d"/>
  <circle cx="98" cy="194" r="7" fill="#f85149"/><circle cx="122" cy="194" r="7" fill="#d29922"/><circle cx="146" cy="194" r="7" fill="#3fb950"/>
  <circle cx="654" cy="194" r="7" fill="#f85149"/><circle cx="678" cy="194" r="7" fill="#d29922"/><circle cx="702" cy="194" r="7" fill="#3fb950"/>
  <text x="92" y="242" fill="#f85149" font-family="monospace" font-size="21">$ Get-Content large.log</text>
  <text x="92" y="282" fill="#8b949e" font-family="monospace" font-size="19">12,840 chars repeated</text>
  <text x="92" y="326" fill="#8b949e" font-family="monospace" font-size="19">PASS ... PASS ... PASS ...</text>
  <text x="92" y="370" fill="#8b949e" font-family="monospace" font-size="19">full local output shown again</text>
  <text x="92" y="414" fill="#f85149" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">baseline: broad visible payload</text>
  <text x="648" y="242" fill="#3fb950" font-family="monospace" font-size="21">$ capsule file ...</text>
  <text x="648" y="282" fill="#e6edf3" font-family="monospace" font-size="19">evidence: 520 chars</text>
  <text x="648" y="326" fill="#58a6ff" font-family="monospace" font-size="19">capsule_id: cap_...</text>
  <text x="648" y="370" fill="#8b949e" font-family="monospace" font-size="19">exact recovery: on demand</text>
  <text x="648" y="414" fill="#3fb950" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Capsule: bounded visible view</text>
  <rect x="72" y="470" width="1056" height="4" rx="2" fill="url(#line)"/>
</svg>
