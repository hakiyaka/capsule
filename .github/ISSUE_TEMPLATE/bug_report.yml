name: Bug report
description: Report a reproducible problem in Capsule.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and include the smallest reproducible case.
  - type: input
    id: version
    attributes:
      label: Capsule version
      description: Which release or commit are you using?
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, action payload, expected behavior, and actual behavior.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Codex/plugin context, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant errors or capsule IDs only when safe; remove credentials and private prompts.
