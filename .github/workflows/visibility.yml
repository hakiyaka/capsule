name: Record GitHub visibility snapshot

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CAPSULE_GITHUB_REPO: ${{ github.repository }}
      CAPSULE_GITHUB_MAX_BUFFER_BYTES: "16777216"
    steps:
      - name: Checkout the audited source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Find the previous successful visibility run
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list --workflow visibility.yml --branch "$GITHUB_REF_NAME" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty' || true)"
          printf 'run_id=%s\n' "$previous" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            echo "Using previous successful visibility run $previous as the comparison source."
          else
            echo "No previous successful visibility run; this snapshot establishes the baseline."
          fi

      - name: Download the previous snapshot when available
        if: steps.previous.outputs.run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          previous="${{ steps.previous.outputs.run_id }}"
          mkdir -p previous
          if ! gh run download "$previous" --name "github-visibility-$previous" --dir previous; then
            echo "The previous artifact is unavailable or expired; continuing without a baseline."
            rm -rf previous
          fi

      - name: Capture metadata, traffic, and referral signals
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s previous/visibility.json ]]; then
            node scripts/github-visibility-audit.cjs --baseline previous/visibility.json --write visibility.json
          else
            node scripts/github-visibility-audit.cjs --write visibility.json
          fi

      - name: Capture the fixed repository-search snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s previous/visibility-search.json ]]; then
            node scripts/github-visibility-audit.cjs --search --baseline previous/visibility-search.json --write visibility-search.json
          else
            node scripts/github-visibility-audit.cjs --search --write visibility-search.json
          fi

      - name: Validate snapshot provenance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.CAPSULE_GITHUB_REPO.toLowerCase();
          for (const file of ["visibility.json", "visibility-search.json"]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            if (report.current?.repo?.toLowerCase() !== expected) {
              throw new Error(`${file}: repository provenance mismatch`);
            }
            if (report.schema_version !== 2) throw new Error(`${file}: unsupported schema`);
          }
          NODE

      - name: Upload the read-only snapshots
        uses: actions/upload-artifact@v4
        with:
          name: github-visibility-${{ github.run_id }}
          path: |
            visibility.json
            visibility-search.json
          if-no-files-found: error
          retention-days: 90
