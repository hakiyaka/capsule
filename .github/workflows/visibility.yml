name: Record GitHub visibility snapshot

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CAPSULE_GITHUB_REPO: ${{ github.repository }}
      CAPSULE_GITHUB_MAX_BUFFER_BYTES: "16777216"
    steps:
      - name: Checkout the audited source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Find the previous successful visibility run
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          candidates="$(gh run list --workflow visibility.yml --branch "$GITHUB_REF_NAME" --status success --limit 20 --json databaseId --jq '.[].databaseId')"
          previous=""
          while IFS= read -r candidate; do
            [[ -z "$candidate" ]] && continue
            artifact_name="github-visibility-$candidate"
            artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100")"
            artifact_present="$(printf '%s' "$artifact_json" | node -e 'const fs=require("node:fs"); const name=process.argv[1]; const data=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(data.artifacts?.some((item) => item.name === name && item.expired !== true) ? "yes" : "no");' "$artifact_name")"
            if [[ "$artifact_present" == "yes" ]]; then
              previous="$candidate"
              break
            fi
          done <<< "$candidates"
          printf 'run_id=%s\n' "$previous" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            echo "Using previous successful visibility run $previous as the comparison source."
          else
            echo "No previous successful visibility run; this snapshot establishes the baseline."
          fi

      - name: Download the previous snapshot when available
        if: steps.previous.outputs.run_id != ''
        env:
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="github-visibility-$PREVIOUS_RUN_ID"
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}/artifacts?per_page=100")"
          artifact_present="$(printf '%s' "$artifact_json" | node -e 'const fs=require("node:fs"); const name=process.argv[1]; const data=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(data.artifacts?.some((item) => item.name === name && item.expired !== true) ? "yes" : "no");' "$artifact_name")"
          if [[ "$artifact_present" != "yes" ]]; then
            echo "The previous artifact is unavailable or expired; continuing without a baseline."
            exit 0
          fi
          mkdir -p previous
          gh run download "$PREVIOUS_RUN_ID" --name "$artifact_name" --dir previous
          node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.CAPSULE_GITHUB_REPO.toLowerCase();
          for (const file of ["previous/visibility.json", "previous/visibility-search.json"]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            if (report.audit !== "github-visibility" || report.schema_version !== 2) {
              throw new Error(`${file}: incompatible audit schema`);
            }
            if (report.current?.repo?.toLowerCase() !== expected) {
              throw new Error(`${file}: repository provenance mismatch`);
            }
          }
          const search = JSON.parse(fs.readFileSync("previous/visibility-search.json", "utf8"));
          const expectedQueries = [
            "codex token efficiency",
            "mcp context compression",
            "codex-plugin mcp",
            "token reduction codex",
            "exact recoverable context",
          ];
          const actualQueries = search.search?.queries?.map((entry) => entry?.query);
          if (!Array.isArray(actualQueries) || JSON.stringify(actualQueries) !== JSON.stringify(expectedQueries)) {
            throw new Error("previous/visibility-search.json: missing query snapshots");
          }
          const provenance = JSON.parse(fs.readFileSync("previous/visibility-provenance.json", "utf8"));
          if (provenance.schema_version !== 1 || provenance.repository.toLowerCase() !== expected ||
              provenance.workflow_file !== ".github/workflows/visibility.yml" ||
              provenance.run_id !== Number(process.env.PREVIOUS_RUN_ID) || !provenance.sha || !provenance.ref) {
            throw new Error("previous/visibility-provenance.json: incompatible provenance");
          }
          NODE

      - name: Capture metadata, traffic, and referral signals
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s previous/visibility.json ]]; then
            node scripts/github-visibility-audit.cjs --baseline previous/visibility.json --write visibility.json
          else
            node scripts/github-visibility-audit.cjs --write visibility.json
          fi

      - name: Capture the fixed repository-search snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s previous/visibility-search.json ]]; then
            node scripts/github-visibility-audit.cjs --search --baseline previous/visibility-search.json --write visibility-search.json
          else
            node scripts/github-visibility-audit.cjs --search --write visibility-search.json
          fi

      - name: Write snapshot provenance
        env:
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("visibility.json", "utf8"));
          const baselineUsed = Boolean(report.baseline) && fs.existsSync("previous/visibility.json");
          const previousRun = process.env.PREVIOUS_RUN_ID || null;
          const provenance = {
            schema_version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflow_file: ".github/workflows/visibility.yml",
            workflow: process.env.GITHUB_WORKFLOW,
            run_id: Number(process.env.GITHUB_RUN_ID),
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            ref: process.env.GITHUB_REF,
            sha: process.env.GITHUB_SHA,
            captured_at: report.current?.measured_at || null,
            baseline_used: baselineUsed,
            baseline_run_id: baselineUsed && previousRun ? Number(previousRun) : null,
            baseline_artifact_name: baselineUsed && previousRun ? `github-visibility-${previousRun}` : null,
          };
          fs.writeFileSync("visibility-provenance.json", `${JSON.stringify(provenance, null, 2)}\n`, "utf8");
          NODE

      - name: Validate snapshot provenance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const expected = process.env.CAPSULE_GITHUB_REPO.toLowerCase();
          for (const file of ["visibility.json", "visibility-search.json"]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            if (report.current?.repo?.toLowerCase() !== expected) {
              throw new Error(`${file}: repository provenance mismatch`);
            }
            if (report.schema_version !== 2) throw new Error(`${file}: unsupported schema`);
          }
          const provenance = JSON.parse(fs.readFileSync("visibility-provenance.json", "utf8"));
          if (provenance.schema_version !== 1 || provenance.repository.toLowerCase() !== expected) {
            throw new Error("visibility-provenance.json: invalid provenance");
          }
          if (provenance.sha !== process.env.GITHUB_SHA || provenance.run_id !== Number(process.env.GITHUB_RUN_ID)) {
            throw new Error("visibility-provenance.json: run identity mismatch");
          }
          NODE

      - name: Upload the read-only snapshots
        uses: actions/upload-artifact@v4
        with:
          name: github-visibility-${{ github.run_id }}
          path: |
            visibility.json
            visibility-search.json
            visibility-provenance.json
          overwrite: true
          if-no-files-found: error
          retention-days: 90
